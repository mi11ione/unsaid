<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UNSAID image 3</title>
<link rel="stylesheet" href="../site/css/unsaid.css">
<style>
  html, body { overflow: hidden; }
  #stage { width: 1600px; height: 1000px; position: relative; padding: 0 40px; background: var(--bg); }
  .top { height: 56px; min-height: 0; padding: 0; }
  h1.hl { font: 400 54px/1.05 var(--serif); letter-spacing: -.012em; margin: 34px 0 26px; }
  h1.hl s { text-decoration: none; position: relative; }
  h1.hl s::after { content: ''; position: absolute; left: -.03em; right: -.03em; top: 56%; height: .065em; background: var(--red); box-shadow: 0 0 0 .02em var(--bg); }
  .cols3 { display: grid; grid-template-columns: 700px 1fr; gap: 44px; }
  .chat { border: 1px solid var(--rule2); background: #0f0f0e; height: 640px; overflow: hidden; position: relative; font: 15px/1.5 -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #d9d7d0; }
  .chat .who { padding: 12px 18px; border-bottom: 1px solid var(--rule2); font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; }
  .chat .who span { font-weight: 400; color: var(--dim); font-family: var(--mono); font-size: 11px; }
  .chat .u { margin: 16px 18px 6px auto; max-width: 560px; background: #222220; border-radius: 16px; padding: 10px 14px; color: #ecebe5; }
  .chat .a { padding: 4px 22px 0; }
  .chat .a p { margin: 0 0 9px; } .chat .a h3 { font-size: 16px; margin: 4px 0 6px; } .chat .a h4 { font-size: 15px; margin: 8px 0 3px; }
  .chat .a b { color: #f2efe6; }
  .chat .x { position: relative; color: var(--dim); }
  .chat .x::after { content: ''; position: absolute; left: -1px; right: -1px; top: 55%; height: 2px; background: var(--red); }
  .chat::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(rgba(15,15,14,0), #0f0f0e); }
  .cap3 { margin-top: 10px; color: var(--dim); font-size: 13px; }
  .seven .sh h2 { font-size: 12px; }
  .row7 { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .row7 .i { color: var(--faint); }
  .row7 .nm7 { font: 400 22px/1.15 var(--serif); color: var(--white); }
  .row7 .b { grid-column: 2; color: var(--dim); font-size: 12px; }
  .row7 .b b { color: var(--ink); font-weight: 400; }
  .row7 .pr { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-size: 12px; color: var(--dim); }
  .row7 .pr b { font: 600 20px/1 var(--mono); color: var(--ink); }
  .trace { position: absolute; left: 40px; right: 40px; bottom: 30px; border-top: 1px solid var(--rule2); padding-top: 12px; display: flex; gap: 30px; align-items: flex-start; }
  .trace .t { font-size: 13px; color: var(--dim); flex: 1; } .trace .t b { color: var(--ink); font-size: 15px; }
  .tool { border: 1px solid var(--rule2); padding: 8px 12px; font-size: 11.5px; color: var(--ink); width: 470px; }
  .tool .c { color: var(--dim); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 4px; }
  .meter { position: absolute; right: 40px; top: 70px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../site/js/map.js"></script>
<script src="../site/js/matcher.js"></script>
<script>
/* image3.html[?src=<results>]   Devpost image 3 (UNSAID.md §6.3): without and with.
   Left: the real assistant answer to "plan my Friday … but nothing every AI would tell me" (media/data/assistant.json,
   from agent/demo/claude_without.jsonl), every name on the results file's wall struck. Right: the seven with their
   because-line and pair. Bottom: the Qloo call trace from diag, and the tool_use inset. The meter line shows only if
   site/data/meter.json says it is featured. One count on the image: the Qloo call count. */
(async function () {
  const { el, esc, ph } = UM;
  const SRC = UM.param('src', '../site/data/mock/stl-cedric.ndjson');
  const [R, A, MT] = await Promise.all([UM.result(SRC), UM.json('data/assistant.json'), UM.json('../site/data/meter.json')]);
  const fake = (R.flags || []).includes('fake'), flat = (R.flags || []).includes('flat');
  const city = (R.city && R.city.name) || 'St. Louis';
  const S = document.getElementById('stage');
  el(S, 'div', '', `<span class="mark"><s>UN</s>SAID</span><span class="slug">${esc(city)} · without and with</span><span class="grow"></span>` +
    (fake ? '<span class="mock">mock data · the 7 are not real cards yet</span>' : '')).className = 'top';
  el(S, 'h1', '', 'Everything the AIs tell everyone, <s>crossed out</s>.').className = 'hl';
  const g = el(S, 'div', ''); g.className = 'cols3';

  // ---- left: the answer. The strikes come from the engine's own matcher (match_wall, run by build_data.py against the
  //      census wall); a span is drawn struck only where R1 fired. assistant.json lists every rule that fired.
  const text = A.answer || '';
  const spans = (A.strikes || []).filter(x => x.struck).map(x => [x.start, x.end, x.matches.filter(m => m.rule === 'R1').map(m => m.wall + ' (R1)').join(', ')]);
  spans.sort((a, b) => a[0] - b[0]);
  window.__struck = spans.map(s => s[2] + ' ← ' + text.slice(s[0], s[1]));
  let html = '', at = 0;
  for (const [s0, s1] of spans) { html += esc(text.slice(at, s0)) + '\u0001' + esc(text.slice(s0, s1)) + '\u0002'; at = s1; }
  html += esc(text.slice(at));
  // light markdown: headings, bold, bullets, paragraphs
  html = html.split('\n').map(l => {
    l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
    if (/^### /.test(l)) return `<h4>${l.slice(4)}</h4>`;
    if (/^# /.test(l)) return `<h3>${l.slice(2)}</h3>`;
    if (/^- /.test(l)) return `<p>· ${l.slice(2)}</p>`;
    return l.trim() ? `<p>${l}</p>` : '';
  }).join('').replace(/\u0001/g, '<span class="x">').replace(/\u0002/g, '</span>');
  const left = el(g, 'div', '');
  left.innerHTML = `<div class="chat"><div class="who">assistant<span>${A.model ? esc(A.model) + ' · ' : ''}no tools</span></div>
      <div class="u">${esc(A.prompt)}</div><div class="a">${html}</div></div>
    <div class="cap3">Asked to avoid what every AI says. <span class="red">Struck</span>: names that match ${esc(city)}’s everyone-list exactly.</div>`;

  // ---- right: the seven
  const right = el(g, 'div', ''); right.className = 'seven';
  right.innerHTML = `<div class="sh"><h2>Left for you</h2><span class="sub">ranked by Qloo</span></div>` + R.picks.map((c, i) => `
    <div class="row7"><span class="i">${String(i + 1).padStart(2, '0')}</span>
      <span class="nm7">${c.name ? esc(c.name) : ph(null, `place ${i + 1}`)}</span>
      <span class="pr">${c.tied || c.fit_rank == null ? '' : `<b>#${c.fit_rank}</b> for you`}${flat ? '' : `<br>#${ph(c.any_rank, 'ANY')} for anyone`}</span>
      <span class="b">because you love <b>${ph(c.because, 'love')}</b> · ${ph(c.neighbourhood, 'neighbourhood')}</span></div>`).join('');

  // ---- the trace: "⟦QLOO_CALLS⟧ Qloo calls · your pool ×⟦6⟧ → same places, each love alone ×⟦15⟧ → names → IDs ×⟦5⟧ → popularity cap ×1"
  const D = R.diag || {}, CL = D.calls || {};
  const loves = (R.loves || []).filter(l => !l.dead).map(l => JSON.stringify(l.label)).join(', ');
  const tr = el(S, 'div', ''); tr.className = 'trace';
  tr.innerHTML = `<div class="t"><b>${ph(CL.total ?? D.qloo_calls, 'QLOO_CALLS')} Qloo calls</b> · your pool ×${ph(CL.pool, '6')} → same places, each love alone ×${ph(CL.rescore, '15')} → names → IDs ×${ph(CL.ids, '5')} → popularity cap ×${ph(CL.cap, '1')}</div>
    <div class="tool"><div class="c">Other agents call this.</div>tool_use · unsaid_places({ loves: [${esc(loves)}], city: "${esc(city)}" })</div>`;
  if (MT.featured) el(S, 'div', '', `alone ${ph(MT.m_alone, 'M_ALONE')} of ${MT.of} on the everyone-list · with Qloo ${ph(MT.m_qloo, 'M_QLOO')}`).className = 'meter';
  window.__ready = true;
})().catch(e => { window.__error = String(e && e.stack || e); window.__ready = true; document.body.insertAdjacentHTML('beforeend', `<pre style="color:#ff2d3d">${e}</pre>`); });
</script>
</body>
</html>
