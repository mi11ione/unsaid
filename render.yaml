# Render Blueprint: the UNSAID engine host (UNSAID.md §3.9). Free web service, standard library only.
# Values are set in the Render dashboard, never here. See server/DEPLOY.md.
services:
  - type: web
    name: unsaid-engine
    runtime: python
    plan: free
    region: ohio
    buildCommand: python3 -c "import sys; print(sys.version)"
    startCommand: python3 -I server/app.py
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: UNSAID_MODE            # fake | live
        sync: false
      - key: UNSAID_TOKEN           # REST/MCP token until Thu 30 Oct 23:45 ET
        sync: false
      - key: UNSAID_PROXY_SECRET    # same value as the Pages secret PROXY_SECRET
        sync: false
      - key: UNSAID_BENCH_SECRET    # k11's X-Unsaid-Bench: skips the per-IP limit; never the proxy secret
        sync: false
      - key: QLOO_GZIP              # optional, default 1 (gzip responses; 0 = identity)
        sync: false
      - key: QLOO_POOL              # optional, default 8 idle keep-alive connections to Qloo
        sync: false
      - key: UNSAID_LASTSEEN_S      # optional, default 3: the per-run budget for the venue-site checks
        sync: false
      - key: UNSAID_MAX_ACTIVE      # optional, default 2 concurrent fresh runs
        sync: false
      - key: UNSAID_TOKEN_REQUIRED  # 1 until 30 Oct 23:45 ET; the flip sets 0 and KEEPS UNSAID_TOKEN (its 60/h bucket)
        sync: false
      - key: UNSAID_TOKEN_PER_HOUR  # optional, default 60 fresh runs/h for the token holder (connectors share an IP)
        sync: false
      - key: UNSAID_FRESH_PER_HOUR  # optional; default 15/h per IP through 6 Nov 2026 ET, then 3
        sync: false
      - key: UNSAID_RSS_SOFT_MB     # optional, default 300: above it the server clears the engine's memo caches
        sync: false
      - key: UNSAID_PRIORS_DIR      # /etc/secrets: the priors are Render secret files (server/push_priors.py), never in git
        sync: false
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_QUOTA_HEADERS     # "<remaining header>,<limit header>" once probe P9 names them
        sync: false
      - key: QLOO_MONTHLY_QUOTA
        sync: false
      - key: GEMINI_API_KEY         # AI Studio key, project with no billing linked
        sync: false
      - key: GEMINI_LIVE_MODEL      # the live lane's own model: gemini-3-flash-preview (not the dated lane's 3.8 Flash)
        sync: false
      - key: GEMINI_RPD             # 20 (free tier, per model); the server stops live asks at 16/day
        sync: false
      - key: UNSAID_WALLS           # optional: a walls JSON file or directory; default data/walls/ in the repo
        sync: false
