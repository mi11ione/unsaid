# Keeps the Render free engine warm (it spins down after 15 min idle; UNSAID.md §3.9).
# Every 10 min (GitHub runs schedules best-effort, sometimes late). Ordinary inbound traffic to the open health route.
name: keepwarm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/health
        run: |
          curl -sS -m 150 -o /dev/null -w "health %{http_code} in %{time_total}s\n" \
            https://unsaid-a1wy.onrender.com/api/health || echo "health ping failed (cold start or network)"
